services:
  dockraft:
    image: marcusm99/dockraft:latest
    build: .
    container_name: dockraft
    restart: unless-stopped
    ports:
      # Panel de Control Web
      - "${PANEL_PORT:-8000}:8000"
      # Puerto Minecraft Java
      - "${MC_JAVA_PORT:-25565}:25565"
      # Puerto Minecraft Bedrock
      - "${MC_BEDROCK_PORT:-19132}:19132/udp"
    environment:
      - DATA_DIR=/server_data
      - BACKUPS_DIR=/server_backups
      - HOST=0.0.0.0
      - PORT=8000
      # Zona horaria del servidor (ej. America/Guayaquil, Europe/Madrid, America/Mexico_City)
      - TZ=${TZ:-America/Guayaquil}
      # Usuario administrador para acceder al panel web
      - ADMIN_USER=${ADMIN_USER:-admin}
      # Contraseña OBLIGATORIA para acceder al panel (si se deja vacía, se generará una aleatoria en los logs de inicio)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Clave secreta para firmas de sesión — CAMBIA ESTO en producción (usa: openssl rand -hex 32)
      - SECRET_KEY=${SECRET_KEY:-}
      # Orígenes CORS permitidos (separados por coma)
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Seguridad de sesión y proxy inverso
      - HTTPS_ENABLED=${HTTPS_ENABLED:-false}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1,::1}
      # Rate limiting y expiración de sesión
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS:-5}
      - LOGIN_COOLDOWN_SECONDS=${LOGIN_COOLDOWN_SECONDS:-600}
      - SESSION_TIMEOUT_MINUTES=${SESSION_TIMEOUT_MINUTES:-60}
    volumes:
      # Persistencia de todos los mundos, plugins, mods y configuraciones del servidor
      - ./data:/server_data
      # Directorio independiente para almacenar copias de seguridad
      - ./backups:/server_backups
