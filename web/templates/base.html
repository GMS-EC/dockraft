<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{% block title %}Dockraft — Panel de Control para Minecraft{% endblock %}</title>
  <meta name="description" content="Panel de control web ultra-ligero y optimizado para servidores de Minecraft Java y Bedrock.">
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <link rel="apple-touch-icon" href="/static/img/logo.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#161b22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dockraft">
  <link rel="stylesheet" href="/static/css/style.css?v=1.1.2">
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  {% block content %}{% endblock %}

  <!-- Toast Notification System -->
  <div id="toast-container" class="toast-container" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:340px;"></div>

  <!-- Internationalization Script (i18n) -->
  <script src="/static/js/i18n.js?v=1.1.0"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
