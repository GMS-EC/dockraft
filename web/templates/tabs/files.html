<!-- TAB 5: FILE MANAGER -->
<section class="tab-pane" id="tab-files">
  <div class="card file-manager-card" id="file-manager-card" style="position: relative;">
    <!-- Drag & Drop Visual Overlay -->
    <div id="file-drop-overlay" class="file-drop-overlay" style="display: none;">
      <div class="file-drop-message">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <h4 data-i18n="t_file_dropzone_title">Suelta los archivos aquí para subirlos</h4>
        <p id="file-dropzone-target-text" data-i18n="t_file_dropzone_subtitle">Se guardarán en: /data</p>
      </div>
    </div>

    <div class="file-manager-header" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;">
      <div class="breadcrumbs" id="file-breadcrumbs" style="flex: 1; min-width: 160px;">
        <span class="crumb-item">/data</span>
      </div>

      <div class="file-search-container" style="position: relative; min-width: 180px; max-width: 280px; flex: 1;">
        <svg style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="file-search-input" class="form-input file-search-input" placeholder="Buscar archivos..." data-i18n-placeholder="t_file_search_ph" style="padding-left: 32px; height: 36px; font-size: 0.85rem; width: 100%;" oninput="Files.filterFiles(this.value)">
      </div>

      <div class="file-header-actions" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <input type="file" id="file-upload-input" style="display:none;" multiple onchange="if(this.files && this.files.length) { Files.handleUploadFiles(this.files); this.value = ''; }">
        <button type="button" class="btn btn-outline" onclick="document.getElementById('file-upload-input').click()" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span data-i18n="t_file_upload">Subir Archivo</span>
        </button>
        <button type="button" class="btn btn-outline" onclick="Files.openCreateFileModal()" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          <span data-i18n="t_file_new_file">Nuevo Archivo</span>
        </button>
        <button type="button" class="btn btn-outline" onclick="Files.createNewFolder()" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
          <span data-i18n="t_file_new_folder">Nueva Carpeta</span>
        </button>
        <button type="button" class="btn btn-outline" onclick="Files.loadDirectory(Files.currentPath)" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          <span data-i18n="t_file_refresh">Refrescar</span>
        </button>
      </div>
    </div>

    <!-- Bulk Actions Bar -->
    <div id="files-bulk-bar" class="files-bulk-bar" style="display: none;">
      <div class="bulk-bar-left" style="display: flex; align-items: center; gap: 8px;">
        <span id="bulk-selected-count" class="bulk-count" style="font-weight: 600; font-size: 0.85rem; color: #58a6ff;">0 seleccionados</span>
      </div>
      <div class="bulk-bar-right" style="display: flex; align-items: center; gap: 8px;">
        <button class="btn btn-sm btn-outline" onclick="Files.bulkCompress()" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span data-i18n="t_file_bulk_compress">Comprimir ZIP</span>
        </button>
        <button class="btn btn-sm btn-danger" onclick="Files.bulkDelete()" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          <span data-i18n="t_file_bulk_delete">Eliminar</span>
        </button>
        <button class="btn btn-sm btn-outline" onclick="Files.clearSelection()" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span data-i18n="t_file_bulk_clear">Deseleccionar</span>
        </button>
      </div>
    </div>

    <!-- Drag & Drop Overlay -->
    <div id="file-dropzone-overlay" class="file-dropzone-overlay" style="display: none;">
      <div class="file-dropzone-content">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <h4 data-i18n="t_file_dropzone_title" style="margin-top: 12px; margin-bottom: 4px; font-weight: 600;">Suelta archivos aquí para subirlos</h4>
        <p id="dropzone-target-text" style="color: var(--text-muted); font-size: 0.85rem; margin: 0;">Destino: /data</p>
      </div>
    </div>

    <div class="table-responsive">
      <table class="file-table" id="file-manager-table">
        <thead>
          <tr>
            <th style="width: 38px; text-align: center;">
              <input type="checkbox" id="file-select-all" class="form-checkbox" onclick="Files.toggleSelectAll(this.checked)" title="Seleccionar todo">
            </th>
            <th data-i18n="t_file_col_name">Nombre</th>
            <th style="width: 120px;" data-i18n="t_file_col_size">Tamaño</th>
            <th class="col-modified" style="width: 200px;" data-i18n="t_file_col_modified">Modificado</th>
            <th style="width: 140px; text-align: right;" data-i18n="t_file_col_actions">Acciones</th>
          </tr>
        </thead>
        <tbody id="files-table-body">
          <!-- Files loaded dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Floating Context Menu -->
  <div id="file-context-menu" class="context-menu">
    <!-- Injected dynamically by Files.showContextMenu -->
  </div>

  <!-- Floating Upload Manager Widget -->
  <div id="file-upload-widget" class="file-upload-widget" style="display: none;">
    <div class="file-upload-widget-header" onclick="Files.toggleUploadManagerCollapse()">
      <div class="file-upload-widget-title-area">
        <div class="file-upload-status-icon" id="file-upload-widget-status-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="file-upload-widget-titles">
          <span class="file-upload-widget-title" id="file-upload-widget-title" data-i18n="t_file_upload_manager_title">Subidas de Archivos</span>
          <span class="file-upload-widget-subtitle" id="file-upload-widget-subtitle">...</span>
        </div>
      </div>
      <div class="file-upload-widget-actions" onclick="event.stopPropagation()">
        <button type="button" class="upload-widget-btn" id="btn-upload-widget-collapse" onclick="Files.toggleUploadManagerCollapse()" title="Minimizar / Expandir" aria-label="Minimizar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="icon-upload-widget-collapse"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button type="button" class="upload-widget-btn" id="btn-upload-widget-close" onclick="Files.closeUploadManager()" title="Cerrar panel" aria-label="Cerrar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="file-upload-widget-global-progress">
      <div class="file-upload-widget-global-bar" id="file-upload-global-bar" style="width: 0%;"></div>
    </div>
    <div class="file-upload-widget-body" id="file-upload-widget-body">
      <div class="file-upload-widget-list" id="file-upload-widget-list">
        <!-- Populated dynamically by Files.uploadManager -->
      </div>
      <div class="file-upload-widget-footer" id="file-upload-widget-footer" style="display: none;">
        <button type="button" class="btn btn-outline btn-sm" onclick="Files.clearCompletedUploads()" style="font-size: 0.76rem; padding: 4px 10px;">
          <span data-i18n="t_file_upload_btn_clear">Limpiar completados</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Rename File or Folder -->
  <div class="modal-backdrop" id="modal-file-rename">
    <div class="modal-box" style="max-width: 420px; border: 1px solid #30363d;">
      <div class="modal-header">
        <h3 style="display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span data-i18n="t_file_rename_title">Renombrar</span>
        </h3>
        <button class="action-icon-btn" onclick="Files.closeRenameModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="input-file-rename" data-i18n="t_file_rename_label">Nuevo Nombre:</label>
          <input type="text" class="form-input" id="input-file-rename" required onkeydown="if(event.key === 'Enter') Files.submitRename()">
        </div>
      </div>
      <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-outline" onclick="Files.closeRenameModal()" data-i18n="t_file_btn_cancel">Cancelar</button>
        <button class="btn btn-primary" onclick="Files.submitRename()" data-i18n="t_file_btn_rename">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Create New File -->
  <div class="modal-backdrop" id="modal-file-create">
    <div class="modal-box" style="max-width: 420px; border: 1px solid #30363d;">
      <div class="modal-header">
        <h3 style="display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          <span data-i18n="t_file_create_file_title">Nuevo Archivo</span>
        </h3>
        <button class="action-icon-btn" onclick="Files.closeCreateFileModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="input-file-create-name" data-i18n="t_file_create_file_label">Nombre del Archivo (con extensión):</label>
          <input type="text" class="form-input" id="input-file-create-name" placeholder="ej: whitelist.json, custom.yml" data-i18n-placeholder="t_file_create_file_placeholder" required onkeydown="if(event.key === 'Enter') Files.submitCreateFile()">
        </div>
      </div>
      <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-outline" onclick="Files.closeCreateFileModal()" data-i18n="t_file_btn_cancel">Cancelar</button>
        <button class="btn btn-primary" onclick="Files.submitCreateFile()" data-i18n="t_file_btn_create_file">Crear Archivo</button>
      </div>
    </div>
  </div>
</section>
